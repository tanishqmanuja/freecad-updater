name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump Type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Determine new version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 || echo "v0.0.0")
          NEW_TAG=$(bunx semver bump "${{ github.event.inputs.bump }}" "$LATEST_TAG")
          echo "VERSION=$NEW_TAG" >> $GITHUB_ENV 
          echo "::set-output name=tag::$NEW_TAG"

      - name: Generate Changelog
        run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Updater.exe for Windows
        run: |
          mkdir -p out
          GOOS=windows GOARCH=amd64 go build -ldflags="-X main.Version=${{ env.VERSION }}" -o out/Updater.exe ./main.go

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeCAD-Updater-Windows
          path: out/Updater.exe
