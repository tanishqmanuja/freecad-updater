name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------
      # 0. Setup
      # ------------------------
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ------------------------
      # 1. Determine next version
      # ------------------------
      - name: Determine next version
        id: version
        run: |
          # Get last tag or default to 0.0.0
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"

          # Strip leading v
          LAST_VERSION="${LAST_TAG#v}"

          # Bump using bun
          NEW_VERSION=$(bunx semver "$LAST_VERSION" --increment ${{ github.event.inputs.bump }})
          echo "New version: $NEW_VERSION"

          # Export version
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # ------------------------
      # 2. Build binary
      # ------------------------
      - name: Build Updater.exe for Windows
        run: |
          mkdir -p output
          GOOS=windows GOARCH=amd64 go build \
            -ldflags="-X main.Version=v${{ steps.version.outputs.new_version }}" \
            -o output/Updater.exe \
            ./main.go

      # ------------------------
      # 3. Create and push tag
      # ------------------------
      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      # ------------------------
      # 4. Generate changelog
      # ------------------------
      - name: Generate Changelog
        run: bunx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------
      # 5. Create release + upload exe
      # ------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.new_version }}"
          name: "FreeCAD Updater v${{ steps.version.outputs.new_version }}"
          prerelease: false
          files: output/Updater.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
